id = "pig"
version = "2026.10.10.1"
min_engine_version = 1
updated_at = "2026-10-10T00:00:00Z"

# Evidence: PiG 0.4.1 (Pi 1.0.3 pin) live capture in Herdr, pane showing an idle session.
# The bottom buffer carries the bordered prompt and a `model · tokens · cwd` footer, and no
# working indicator.
#
# Working rules mirror PiG's default working indicator (`Working` with the braille spinner
# frames shared with Pi), which PiG renders on the border line when it embeds status. Rules
# are kept identical to Pi's because PiG is a parity port of Pi's TUI. Live working frames
# have not been captured yet; re-verify with `herdr pane read <pane> --source detection`
# while a PiG turn is running before relying on these rules.

[[rules]]
id = "working_literal"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
any = [
  { contains = ["Working..."] },
  { line_regex = ['^[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏] Working$'] },
]

[[rules]]
id = "working_border"
state = "working"
priority = 100
region = "bottom_non_empty_lines(12)"
visible_working = true
any = [
  { line_regex = ['^── [⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏] Working ─+$'] },
  { line_regex = ['^[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏] Working$'] },
]
